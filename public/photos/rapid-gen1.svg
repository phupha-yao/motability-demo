<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="600" height="800" font-family="Helvetica, Arial, sans-serif">
  <title>Illustration of a Gen 1 rapid charger on a parking bay</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6f0"/><stop offset="1" stop-color="#f3efe0"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e4e7ea"/><stop offset="0.6" stop-color="#f4f5f6"/><stop offset="1" stop-color="#d5d9dd"/>
    </linearGradient>
    <linearGradient id="asphalt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#55595e"/><stop offset="1" stop-color="#3b3e42"/>
    </linearGradient>
    <linearGradient id="kerb" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8d4ca"/><stop offset="0.35" stop-color="#bdb8ac"/><stop offset="1" stop-color="#8f8b82"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.8">
      <stop offset="0" stop-color="#fff6c8" stop-opacity="0.9"/><stop offset="1" stop-color="#fff6c8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.25"/>
    </radialGradient>
  </defs>

  <!-- sky, canopy and hedge -->
  <rect width="600" height="600" fill="url(#sky)"/>
  <rect x="0" y="0" width="600" height="36" fill="#3a3f45"/>
  <rect x="160" y="34" width="280" height="28" rx="6" fill="#f5f0dc" stroke="#2f3338" stroke-width="3"/>
  <polygon points="160,62 440,62 560,420 40,420" fill="url(#glow)"/>
  <g fill="#6f8f4e">
    <ellipse cx="40" cy="520" rx="90" ry="70"/><ellipse cx="170" cy="540" rx="80" ry="60"/>
    <ellipse cx="460" cy="535" rx="90" ry="62"/><ellipse cx="580" cy="515" rx="80" ry="72"/>
  </g>
  <g fill="#86a45f">
    <ellipse cx="90" cy="545" rx="60" ry="40"/><ellipse cx="520" cy="550" rx="70" ry="40"/>
  </g>
  <rect x="0" y="560" width="600" height="40" fill="#cdc8bb"/>

  <!-- kerb and bay -->
  <rect x="0" y="596" width="600" height="34" fill="url(#kerb)"/>
  <rect x="0" y="630" width="600" height="170" fill="url(#asphalt)"/>
  <clipPath id="zone"><path d="M150 660 L450 660 L470 790 L130 790 Z"/></clipPath>
  <g stroke="#e7c94a" stroke-width="6" opacity="0.9" clip-path="url(#zone)"><line x1="60" y1="790" x2="130" y2="660" /><line x1="86" y1="790" x2="156" y2="660" /><line x1="112" y1="790" x2="182" y2="660" /><line x1="138" y1="790" x2="208" y2="660" /><line x1="164" y1="790" x2="234" y2="660" /><line x1="190" y1="790" x2="260" y2="660" /><line x1="216" y1="790" x2="286" y2="660" /><line x1="242" y1="790" x2="312" y2="660" /><line x1="268" y1="790" x2="338" y2="660" /><line x1="294" y1="790" x2="364" y2="660" /><line x1="320" y1="790" x2="390" y2="660" /><line x1="346" y1="790" x2="416" y2="660" /><line x1="372" y1="790" x2="442" y2="660" /><line x1="398" y1="790" x2="468" y2="660" /><line x1="424" y1="790" x2="494" y2="660" /><line x1="450" y1="790" x2="520" y2="660" /><line x1="476" y1="790" x2="546" y2="660" /></g>
  <path d="M150 660 L450 660 L470 790 L130 790 Z" fill="none" stroke="#f1f1ee" stroke-width="6"/>
  <path d="M90 630 L60 800" stroke="#f1f1ee" stroke-width="8"/>
  <path d="M520 630 L548 800" stroke="#f1f1ee" stroke-width="8"/>

  <!-- bollards -->
  <g>
    <rect x="116" y="438" width="44" height="164" rx="20" fill="#2f5d50"/>
    <rect x="116" y="470" width="44" height="18" fill="#f4f1e6"/>
    <rect x="116" y="500" width="44" height="10" fill="#f4f1e6"/>
    <ellipse cx="138" cy="444" rx="20" ry="7" fill="#3f7465"/>
  </g>
  <g>
    <rect x="536" y="438" width="44" height="164" rx="20" fill="#2f5d50"/>
    <rect x="536" y="470" width="44" height="18" fill="#f4f1e6"/>
    <rect x="536" y="500" width="44" height="10" fill="#f4f1e6"/>
    <ellipse cx="558" cy="444" rx="20" ry="7" fill="#3f7465"/>
  </g>

  <!-- pedestal -->
  <rect x="226" y="584" width="182" height="18" fill="#7e8389"/>
  <rect x="400" y="128" width="16" height="460" fill="#aab0b6"/>
  <path d="M220 600 L220 150 Q220 118 252 118 L370 118 Q400 118 400 150 L400 600 Z" fill="url(#body)" stroke="#8c9298" stroke-width="2"/>
  <rect x="220" y="540" width="180" height="14" fill="#9ba3ab"/>

  <!-- signage -->
  <rect x="232" y="132" width="156" height="46" rx="6" fill="#26323d"/>
  <text x="310" y="154" fill="#f2f2ee" font-size="15" font-weight="700" text-anchor="middle">RAPID 50 kW</text>
  <text x="310" y="171" fill="#9fd5ef" font-size="11" text-anchor="middle">Northway Charging </text>

  <!-- screen -->
  <rect x="248" y="194" width="124" height="98" rx="8" fill="#1d2329"/>
  <rect x="256" y="202" width="108" height="82" rx="4" fill="#2e6d8e"/>
  <text x="310" y="232" fill="#f2f8fb" font-size="11" text-anchor="middle">Tap card or</text>
  <text x="310" y="247" fill="#f2f8fb" font-size="11" text-anchor="middle">use the app</text>
  <rect x="270" y="258" width="80" height="16" rx="3" fill="#89d8ff" opacity="0.6"/>

  <!-- buttons -->
  <rect x="258" y="300" width="104" height="36" rx="18" fill="#cfd4d9"/>
  <circle cx="284" cy="318" r="13" fill="#3e9b5b" stroke="#2b6b3f" stroke-width="2"/>
  <circle cx="336" cy="318" r="13" fill="#5a6168" stroke="#3a4046" stroke-width="2"/>
  <text x="284" y="322" fill="#fff" font-size="9" text-anchor="middle">START</text>
  <text x="336" y="322" fill="#fff" font-size="9" text-anchor="middle">STOP</text>

  <!-- payment terminal -->
  <rect x="244" y="346" width="70" height="86" rx="6" fill="#2a2f35"/>
  <rect x="252" y="354" width="54" height="22" rx="2" fill="#9cb7a3"/>
  <rect x="256" y="384" width="12" height="9" rx="2" fill="#6b737b"/><rect x="273" y="384" width="12" height="9" rx="2" fill="#6b737b"/><rect x="290" y="384" width="12" height="9" rx="2" fill="#6b737b"/><rect x="256" y="398" width="12" height="9" rx="2" fill="#6b737b"/><rect x="273" y="398" width="12" height="9" rx="2" fill="#6b737b"/><rect x="290" y="398" width="12" height="9" rx="2" fill="#6b737b"/><rect x="256" y="412" width="12" height="9" rx="2" fill="#6b737b"/><rect x="273" y="412" width="12" height="9" rx="2" fill="#6b737b"/><rect x="290" y="412" width="12" height="9" rx="2" fill="#6b737b"/>

  <!-- card tap pad -->
  <rect x="322" y="350" width="54" height="56" rx="8" fill="#f8f6ef" stroke="#4b5259" stroke-width="2"/>
  <g fill="none" stroke="#4b5259" stroke-width="2.5" stroke-linecap="round">
    <path d="M343 368 q6 10 0 20"/><path d="M350 364 q9 14 0 28"/><path d="M357 360 q12 18 0 36"/>
  </g>

  <!-- socket -->
  <rect x="250" y="450" width="54" height="54" rx="8" fill="#3a4046"/>
  <circle cx="277" cy="477" r="18" fill="#1c2024" stroke="#8a9198" stroke-width="2"/>
  <circle cx="270" cy="471" r="3" fill="#8a9198"/><circle cx="284" cy="471" r="3" fill="#8a9198"/><circle cx="277" cy="479" r="3" fill="#8a9198"/><circle cx="269" cy="484" r="3" fill="#8a9198"/><circle cx="285" cy="484" r="3" fill="#8a9198"/>

  <!-- emergency stop -->
  <rect x="328" y="444" width="46" height="46" rx="6" fill="#ffd21f" stroke="#a58a10" stroke-width="2"/>
  <circle cx="351" cy="467" r="15" fill="#d6261f" stroke="#8f1813" stroke-width="2"/>

  

  <!-- cable -->
  <path d="M402.0 548.0 L411.1 552.0 L419.7 554.8 L427.8 556.4 L435.6 556.9 L442.8 556.3 L449.6 554.6 L456.0 552.0 L461.9 548.5 L467.4 544.1 L472.4 538.8 L477.0 532.8 L481.1 526.0 L484.8 518.6 L488.1 510.6 L490.9 501.9 L493.3 492.8 L495.2 483.2 L496.7 473.1 L497.8 462.7 L498.5 452.0 L498.7 441.0 L498.5 429.8 L497.9 418.4 L496.9 406.9 L495.4 395.3 L493.6 383.7 L491.3 372.2 L488.5 360.7 L485.4 349.3 L481.9 338.2 L477.9 327.3 L473.6 316.6 L468.8 306.3 L463.6 296.4 L458.0 287.0 L452.0 278.0 L445.6 269.6 L438.8 261.7 L431.6 254.5 L424.0 248.0" fill="none" stroke="#151719" stroke-width="20" stroke-linecap="round"/>
  <path d="M402.0 548.0 L411.1 552.0 L419.7 554.8 L427.8 556.4 L435.6 556.9 L442.8 556.3 L449.6 554.6 L456.0 552.0 L461.9 548.5 L467.4 544.1 L472.4 538.8 L477.0 532.8 L481.1 526.0 L484.8 518.6 L488.1 510.6 L490.9 501.9 L493.3 492.8 L495.2 483.2 L496.7 473.1 L497.8 462.7 L498.5 452.0 L498.7 441.0 L498.5 429.8 L497.9 418.4 L496.9 406.9 L495.4 395.3 L493.6 383.7 L491.3 372.2 L488.5 360.7 L485.4 349.3 L481.9 338.2 L477.9 327.3 L473.6 316.6 L468.8 306.3 L463.6 296.4 L458.0 287.0 L452.0 278.0 L445.6 269.6 L438.8 261.7 L431.6 254.5 L424.0 248.0" fill="none" stroke="#33373b" stroke-width="10" stroke-linecap="round"/>

  <!-- holster -->
  <rect x="398" y="238" width="52" height="70" rx="8" fill="#4d555d" stroke="#2c3238" stroke-width="2"/>
  <rect x="406" y="244" width="36" height="46" rx="5" fill="#2a2f34"/>

  <!-- connector (plug) -->
  <rect x="406" y="186" width="36" height="64" rx="12" fill="#2b2f33"/>
  <rect x="412" y="194" width="24" height="20" rx="6" fill="#4a5158"/>
  <rect x="416" y="220" width="16" height="18" rx="4" fill="#ff7a45"/>

  <rect width="600" height="800" fill="url(#vignette)"/>
</svg>
